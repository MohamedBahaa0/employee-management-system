spring.application.name=logincrud
spring.datasource.url=jdbc:postgresql://localhost:5432/mydb
spring.datasource.username=myuser
spring.datasource.password=mypass
spring.security.user.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
#Keycloak Config
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/Employee
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9090/realms/Employee/protocol/openid-connect/certs
jwt.auth.converter.principle-attribute= preferred_username
jwt.auth.converter.resource-id = Employee-REST-API
keycloak.server-url=http://localhost:9090
keycloak.realm=Employee
keycloak.client-id=Employee-REST-API
keycloak.client-secret=password